name: Quant Gold weekly Telegram report

on:
  schedule:
    - cron: '30 10 * * 0'
      timezone: Europe/Vilnius
  workflow_dispatch:
    inputs:
      week_of:
        description: Monday of the report week (YYYY-MM-DD, required for publication)
        type: string
        required: false
      publish:
        description: Post the selected week to Telegram
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.ref == 'refs/heads/main' && vars.CTRADER_CONFIGURED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish != true) ||
      (vars.TELEGRAM_WEEKLY_ENABLED == 'true' && vars.CTRADER_WEEKLY_VERIFIED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.run_attempt == '1')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: trixtrend-verified-data-sync
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run tests
        run: node --test *.test.mjs
      - name: Install card rendering dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends python3-pil fonts-dejavu-core
      - name: Collect verified results and prepare the report
        run: node weekly-telegram.mjs
        env:
          PYTHON_BIN: /usr/bin/python3
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_ACCOUNT_LOGIN }}
          CTRADER_TOKEN_BUNDLE: ${{ secrets.CTRADER_TOKEN_BUNDLE }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          CTRADER_CONFIGURED: ${{ vars.CTRADER_CONFIGURED }}
          CTRADER_WEEKLY_VERIFIED: ${{ vars.CTRADER_WEEKLY_VERIFIED }}
          TELEGRAM_WEEKLY_ENABLED: ${{ vars.TELEGRAM_WEEKLY_ENABLED }}
          TELEGRAM_WEEKLY_START: ${{ vars.TELEGRAM_WEEKLY_START }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name == 'schedule' || inputs.publish == true) && secrets.TELEGRAM_BOT_TOKEN || '' }}
          REPORT_WEEK: ${{ inputs.week_of }}
          PUBLISH_TELEGRAM: ${{ inputs.publish }}
      - name: Save the preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quant-gold-telegram-preview
          path: weekly-report/
          if-no-files-found: error
          retention-days: 7
